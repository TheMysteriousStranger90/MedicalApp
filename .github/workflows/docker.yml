name: Docker Build

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  docker-build:
    name: Docker Build (dry-run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create dummy certs (CI only — not for production)
        run: |
          mkdir -p certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout certs/server.key -out certs/server.crt \
            -subj "/CN=localhost"
          openssl pkcs12 -export -out certs/server.pfx \
            -inkey certs/server.key -in certs/server.crt \
            -passout pass:P@ssw0rd!
          cp certs/server.pfx certs/client.pfx

      - name: Build grpcservice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Medical.GrpcService/Dockerfile
          push: false
          tags: medical.grpcservice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Medical.Client/Dockerfile
          push: false
          tags: medical.client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
